[package]
name = "scarfeeos-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ScarfeeOS shell: a Tauri window around the assistant panel"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde_json = "1"
