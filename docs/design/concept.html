<!doctype html>
<!-- Concept of the full ScarfeeOS desktop. Not working software. Open with ?lang=ar for Arabic.
     Rendered to docs/images/concept-en.png and concept-ar.png. Uses logical CSS, so Arabic mirrors. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>ScarfeeOS desktop concept</title>
<style>
:root { --teal:#1b6e7a; --teal-deep:#0f4650; --amber:#f2a33a; --surface:#fff; --muted:#f1f3f6; --border:#d3d8e0; --text:#1c2330; --dim:#5a6577; --accent:#2a5db0; --bubble:#dde8fa; font-family:"Segoe UI","Noto Sans","Noto Naskh Arabic",sans-serif; }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; overflow:hidden; }
body { background:linear-gradient(145deg,var(--teal-deep),var(--teal) 58%,#2a8791); color:var(--text); position:relative; }
.band { position:absolute; inset-block-start:-120px; inset-inline-end:560px; inline-size:230px; block-size:1300px; background:var(--amber); opacity:.1; transform:rotate(18deg); }
.window { position:absolute; inset-block-start:64px; inset-inline-start:64px; inline-size:800px; block-size:750px; background:var(--surface); border-radius:14px; box-shadow:0 24px 70px #0006; overflow:hidden; display:flex; flex-direction:column; }
.title { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-block-end:1px solid var(--border); font-weight:600; font-size:17px; }
.dots { display:flex; gap:8px; } .dots i { inline-size:12px; block-size:12px; border-radius:50%; background:var(--border); }
.cal { padding:20px; flex:1; display:flex; flex-direction:column; gap:12px; }
.month { display:flex; justify-content:space-between; align-items:baseline; font-size:22px; font-weight:600; } .month small { font-size:14px; font-weight:400; color:var(--dim); }
.grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); flex:1; }
.grid b { background:var(--muted); padding:8px; font-size:13px; font-weight:600; }
.grid span { background:var(--surface); padding:8px; font-size:14px; min-block-size:92px; display:block; }
.grid .off { background:#f7f8fa; } .grid .now { background:var(--bubble); font-weight:700; }
.ev { display:block; margin-block-start:6px; padding:3px 7px; font-size:12px; font-weight:400; color:#fff; background:var(--teal); border-radius:5px; }
.panel { position:absolute; inset-block-start:64px; inset-inline-end:64px; inline-size:610px; block-size:750px; background:var(--surface); border-radius:14px; box-shadow:0 24px 70px #0006; display:flex; flex-direction:column; overflow:hidden; }
.head { display:flex; align-items:center; gap:12px; padding:14px 20px; border-block-end:1px solid var(--border); font-weight:600; font-size:17px; }
.head svg { inline-size:30px; block-size:30px; } .head em { margin-inline-start:auto; font-style:normal; font-weight:400; font-size:13px; color:var(--dim); }
.talk { flex:1; padding:20px; display:flex; flex-direction:column; gap:14px; font-size:16px; line-height:1.55; }
.me { align-self:flex-end; max-inline-size:80%; padding:10px 15px; background:var(--bubble); border-radius:14px; }
.ai { align-self:flex-start; max-inline-size:92%; padding:12px 15px; border:1px solid var(--border); border-radius:14px; }
.card { margin-block-start:10px; padding:12px; background:var(--muted); border-radius:10px; font-size:15px; } .card b { display:block; }
.card small { color:var(--dim); font-size:13px; }
.btns { display:flex; gap:8px; margin-block-start:10px; } .btn { padding:6px 16px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:#fff; } .btn.go { background:var(--accent); border-color:var(--accent); color:#fff; }
.input { display:flex; align-items:center; gap:12px; padding:14px 20px; border-block-start:1px solid var(--border); }
.field { flex:1; padding:12px 16px; border:1px solid var(--border); border-radius:12px; color:var(--dim); font-size:15px; }
.mic { inline-size:50px; block-size:50px; border-radius:50%; background:var(--teal); display:grid; place-items:center; flex:none; box-shadow:0 0 0 7px #1b6e7a26; } .mic svg { inline-size:24px; block-size:24px; fill:#fff; }
.bar { position:absolute; inset-inline:0; inset-block-end:0; block-size:76px; background:#ffffffee; display:flex; align-items:center; gap:12px; padding-inline:18px; }
.logo { inline-size:50px; block-size:50px; display:grid; place-items:center; } .logo svg { inline-size:42px; block-size:42px; }
.app { inline-size:50px; block-size:50px; border-radius:12px; display:grid; place-items:center; } .app.on { background:var(--bubble); } .app svg { inline-size:30px; block-size:30px; }
.tray { margin-inline-start:auto; display:flex; align-items:center; gap:18px; font-size:14px; text-align:end; line-height:1.25; } .tray b { font-weight:600; font-size:17px; } .tray small { color:var(--dim); font-size:12px; display:block; }
.lang { padding:6px 10px; border:1px solid var(--border); border-radius:8px; }
.stamp { position:absolute; inset-block-start:18px; inset-inline-start:64px; color:#ffffffc9; font-size:15px; letter-spacing:.3px; }
</style>
</head>
<body>
<div class="band"></div>
<div class="stamp" data-t="stamp"></div>
<section class="window">
  <div class="title"><span data-t="calTitle"></span><span class="dots"><i></i><i></i><i></i></span></div>
  <div class="cal">
    <div class="month"><span data-t="month"></span><small data-t="hijri"></small></div>
    <div class="grid" id="grid"></div>
  </div>
</section>
<section class="panel">
  <div class="head"><svg viewBox="0 0 256 256"><rect x="32" y="56" width="192" height="56" rx="28" fill="#1b6e7a"/><rect x="144" y="112" width="48" height="104" fill="#f2a33a"/><rect x="144" y="148" width="48" height="12" fill="#1b6e7a"/><rect x="144" y="174" width="48" height="12" fill="#1b6e7a"/></svg><span data-t="assistant"></span><em data-t="local"></em></div>
  <div class="talk">
    <div class="me" data-t="q1"></div>
    <div class="ai"><span data-t="a1"></span><div class="card"><b data-t="cardTitle"></b><small data-t="cardTime"></small><div class="btns"><span class="btn go" data-t="ok"></span><span class="btn" data-t="no"></span></div></div></div>
    <div class="me" data-t="q2"></div>
    <div class="ai"><span data-t="a2"></span><div class="card"><b>report-2026.pdf</b><small data-t="folder"></small></div></div>
  </div>
  <div class="input"><div class="field" data-t="type"></div><div class="mic"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12z"/></svg></div></div>
</section>
<footer class="bar">
  <div class="logo"><svg viewBox="0 0 256 256"><rect x="32" y="56" width="192" height="56" rx="28" fill="#1b6e7a"/><rect x="144" y="112" width="48" height="104" fill="#f2a33a"/><rect x="144" y="148" width="48" height="12" fill="#1b6e7a"/><rect x="144" y="174" width="48" height="12" fill="#1b6e7a"/></svg></div>
  <div class="app on"><svg viewBox="0 0 24 24" fill="#2a5db0"><path d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 5v10h14V9z"/></svg></div>
  <div class="app"><svg viewBox="0 0 24 24" fill="#1b6e7a"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM8 12h8v1.5H8zm0 4h8v1.5H8z"/></svg></div>
  <div class="app"><svg viewBox="0 0 24 24" fill="#1a7f4b"><path d="M4 4h16v16H4zm2 2v3h5V6zm7 0v3h5V6zM6 11v3h5v-3zm7 0v3h5v-3zM6 16v2h5v-2zm7 0v2h5v-2z"/></svg></div>
  <div class="app"><svg viewBox="0 0 24 24" fill="#c7601d"><path d="M3 5h18v11H13v2h4v2H7v-2h4v-2H3zm2 2v7h14V7z"/></svg></div>
  <div class="app"><svg viewBox="0 0 24 24" fill="#6a4bb0"><path d="M3 6h18v12H3zm2 2.4V16h14V8.4l-7 4.6z"/></svg></div>
  <div class="app"><svg viewBox="0 0 24 24" fill="#b3261e"><path d="M8 5l11 7-11 7z"/></svg></div>
  <div class="app"><svg viewBox="0 0 24 24" fill="#0f4650"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2c.9 0 2.3 2 2.9 5H9.100c.6-3 2-5 2.9-5zM4.300 11h3.600v2H4.300zm5.800 0h3.800v2h-3.800zm6 0h3.600v2h-3.600zM9.100 15h5.800c-.6 3-2 5-2.900 5s-2.300-2-2.900-5z"/></svg></div>
  <div class="tray"><span class="lang" data-t="langBtn"></span><span><b data-t="clock"></b><small data-t="date"></small></span></div>
</footer>
<script>
const T = {
  en: { stamp:'Design concept, not working software', calTitle:'Meetings and reminders', month:'November 2026', hijri:'About Jumada al-awwal 1448 AH', assistant:'ScarfeeOS Assistant', local:'Running on this laptop',
    q1:'Remind me to call the bank tomorrow at 10 am', a1:'Should I save this reminder?', cardTitle:'Call the bank', cardTime:'Tomorrow, 10:00 AM', ok:'Confirm', no:'Cancel', q2:'Find the 2026 report', a2:'I found this file:', folder:'Documents', type:'Type or tap the mic to talk', langBtn:'العربية', clock:'9:41 AM', date:'Sunday, 1 November', days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], ev1:'Call the bank', ev2:'Project review', fmt:n=>n },
  ar: { stamp:'تصور للتصميم، وليس برنامجًا يعمل', calTitle:'الاجتماعات والتذكيرات', month:'نوفمبر 2026', hijri:'نحو جمادى الأولى 1448 هـ', assistant:'مساعد ScarfeeOS', local:'يعمل على هذا الحاسوب',
    q1:'ذكّرني أتصل بالبنك بكرة الساعة 10 الصبح', a1:'هل أحفظ هذا التذكير؟', cardTitle:'الاتصال بالبنك', cardTime:'غدًا، 10:00 صباحًا', ok:'تأكيد', no:'إلغاء', q2:'دوّر لي على تقرير 2026', a2:'وجدت هذا الملف:', folder:'المستندات', type:'اكتب أو اضغط على الميكروفون للتحدث', langBtn:'English', clock:'9:41 ص', date:'الأحد، 1 نوفمبر', days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'], ev1:'الاتصال بالبنك', ev2:'مراجعة المشروع', fmt:n=>n },
};
const lang = new URLSearchParams(location.search).get('lang') === 'ar' ? 'ar' : 'en';
const t = T[lang];
document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.querySelectorAll('[data-t]').forEach(n => { n.textContent = t[n.dataset.t]; n.dir = 'auto'; });
const g = document.getElementById('grid');
t.days.forEach(d => { const b = document.createElement('b'); b.textContent = d; g.append(b); });
for (let i = 1; i <= 35; i++) {
  const s = document.createElement('span'); const day = i <= 30 ? i : i - 30;
  s.textContent = day; if (i > 30) s.className = 'off'; if (i === 1) s.className = 'now';
  const ev = i === 2 ? t.ev1 : i === 5 ? t.ev2 : null;
  if (ev) { const e = document.createElement('i'); e.className = 'ev'; e.style.fontStyle = 'normal'; e.textContent = ev; s.append(e); }
  g.append(s);
}
</script>
</body>
</html>
