name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build, test, clippy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows:
    name: Windows check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain with the Windows target
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - name: Check, tests included
        run: cargo check --locked --all-targets --target x86_64-pc-windows-gnu

  panel:
    name: Panel and bridge tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
      - name: Panel and dev bridge
        run: node --test shell/ui/*.test.js shell/ui/*.test.mjs
      - name: Installer page and its bridge
        run: node --test shell/installer/*.test.js shell/installer/*.test.mjs
      - name: Tauri chat shim
        run: node --test shell/src-tauri/chat-shim.test.mjs

  python:
    name: Image definition and eval tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Image definition
        run: python3 os-image/test_image_definition.py
      - name: Eval grader and pipeline
        working-directory: core/eval
        run: python3 -m unittest discover -s .

  shell:
    name: Tauri shell build and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Cache Cargo downloads and build output
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target
          key: shell-${{ runner.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
          restore-keys: shell-${{ runner.os }}-
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check core licenses
        working-directory: core
        run: cargo deny check licenses
      - name: Check shell licenses
        working-directory: shell/src-tauri
        run: cargo deny check licenses

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "Missing Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Commit with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
