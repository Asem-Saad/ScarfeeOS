name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build, test, clippy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check licenses
        run: cargo deny check licenses

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "Missing Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Commit with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
